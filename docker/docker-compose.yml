# ── Shared env anchor ──────────────────────────────────────────────────────────
# Full DSNs per PRD §14 — each service merges this anchor with <<: *common-env
x-common-env: &common-env
  POSTGRES_URL: postgresql://codeatlas:${DB_PASSWORD:-password}@postgres:5432/codeatlas
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: codeatlas
  DB_USER: codeatlas
  DB_PASSWORD: ${DB_PASSWORD:-password}
  REDIS_URL: redis://redis:6379/0
  REDIS_HOST: redis
  REDIS_PORT: 6379
  QDRANT_URL: http://qdrant:6333
  QDRANT_HOST: qdrant
  QDRANT_PORT: 6333
  NEO4J_URL: bolt://neo4j:7687
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
  NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
  EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-local}
  EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-all-MiniLM-L6-v2}
  HF_HOME: /home/codeatlas/.cache/huggingface
  SENTENCE_TRANSFORMERS_HOME: /home/codeatlas/.cache/huggingface
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  MINIO_SECURE: "false"
  SECRET_KEY: ${SECRET_KEY:-dev-secret-must-be-32-chars-long!!}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_FORMAT: ${LOG_FORMAT:-console}
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
  OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
  LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5-20251001}
  KROKI_URL: http://kroki:8000
  AI_SERVICE_URL: http://backend:8000
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_SERVICE_NAME: codeatlas-backend
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}

x-healthcheck-defaults: &healthcheck-defaults
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 10s

services:

  # ────────────────────────────────────────────────────────────────────────────
  # INFRASTRUCTURE
  # ────────────────────────────────────────────────────────────────────────────

  gateway:
    image: nginx:1.25-alpine
    profiles: ["core"]
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    profiles: ["core"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: codeatlas
      POSTGRES_USER: codeatlas
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeatlas -d codeatlas"]
      <<: *healthcheck-defaults

  redis:
    image: redis:7-alpine
    profiles: ["core"]
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck-defaults

  qdrant:
    image: qdrant/qdrant:v1.9.0
    profiles: ["core"]
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      <<: *healthcheck-defaults

  neo4j:
    image: neo4j:5.18-community
    profiles: ["core"]
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test:
        - CMD
        - cypher-shell
        - -u
        - neo4j
        - -p
        - ${NEO4J_PASSWORD:-password}
        - "RETURN 1"
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2024-07-04T14-25-45Z
    profiles: ["core"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      <<: *healthcheck-defaults

  # ────────────────────────────────────────────────────────────────────────────
  # AI RUNTIME (optional — requires GPU for best performance)
  # ────────────────────────────────────────────────────────────────────────────

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # Uncomment for NVIDIA GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ────────────────────────────────────────────────────────────────────────────
  # DIAGRAM RENDERER
  # ────────────────────────────────────────────────────────────────────────────

  kroki:
    image: yuzutech/kroki:latest
    profiles: ["core"]
    restart: unless-stopped
    environment:
      # Mermaid (the default diagram format) is rendered by a companion service.
      KROKI_MERMAID_HOST: kroki-mermaid
      KROKI_MERMAID_PORT: 8002
    depends_on:
      - kroki-mermaid
    ports:
      - "8009:8000"

  kroki-mermaid:
    image: yuzutech/kroki-mermaid:latest
    profiles: ["core"]
    restart: unless-stopped
    expose:
      - "8002"

  # ────────────────────────────────────────────────────────────────────────────
  # BACKEND SERVICES
  # ────────────────────────────────────────────────────────────────────────────

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
      args:
        EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-all-MiniLM-L6-v2}
    image: codeatlas/backend:latest
    profiles: ["core"]
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      <<: *healthcheck-defaults
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
      args:
        EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-all-MiniLM-L6-v2}
    image: codeatlas/backend:latest
    profiles: ["core"]
    restart: unless-stopped
    environment:
      <<: *common-env
      # Each forked child loads its own copy of the sentence-transformers
      # model; without these, PyTorch spawns a thread pool per core and the
      # resident set balloons until the kernel OOM-kills the children.
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - repo_cache:/tmp/repos
      - ${SSH_KEY_DIR:-~/.ssh}:/home/codeatlas/.ssh:ro
    # Embedding/parsing are memory-bound, not IO-bound: keep concurrency low.
    command: >
      celery -A app.workers.celery_app:celery_app worker
      --loglevel=info
      --concurrency=${WORKER_CONCURRENCY:-2}
      --max-memory-per-child=1500000
      --queues=indexing,cleanup,default
      --hostname=worker@%h
    mem_limit: ${WORKER_MEM_LIMIT:-6g}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping -d worker@$$(hostname) --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ────────────────────────────────────────────────────────────────────────────
  # OBSERVABILITY
  # ────────────────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/provisioning/dashboards/json:/etc/grafana/provisioning/dashboards/json:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    image: codeatlas/frontend:latest
    profiles: ["core"]
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  minio_data:
  ollama_data:
  repo_cache:
  prometheus_data:
  grafana_data:
